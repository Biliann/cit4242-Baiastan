spring.application.name=online-store
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/online_store}
spring.datasource.username=${DB_USERNAME:store}
spring.datasource.password=${DB_PASSWORD:store}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.mvc.log-resolved-exception=false
server.error.include-stacktrace=never
server.error.include-message=never
