services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: online_store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
    ports:
      - "5432:5432"
    volumes:
      - store-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d online_store"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/online_store
      DB_USERNAME: store
      DB_PASSWORD: store
    depends_on:
      db:
        condition: service_healthy
volumes:
  store-data:
